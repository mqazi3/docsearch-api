services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docsearch
      POSTGRES_PASSWORD: docsearch   # local development only
      POSTGRES_DB: docsearch
    ports:
      - "5434:5432"                  # 5434 so it doesn't clash with FinFlow's 5433
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsearch -d docsearch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"                  # 6380 so it doesn't clash with FinFlow's 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://docsearch:docsearch@db:5432/docsearch
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://docsearch:docsearch@db:5432/docsearch
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["rq", "worker", "ingestion", "--url", "redis://redis:6379/0"]
    environment:
      DATABASE_URL: postgresql+psycopg://docsearch:docsearch@db:5432/docsearch
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy      

volumes:
  pgdata:
  uploads: