# Production stack for a single host. Caddy terminates TLS; nothing else is exposed.
name: docsearch

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://docsearch:${POSTGRES_PASSWORD}@db:5432/docsearch
  REDIS_URL: redis://redis:6379/0
  ENVIRONMENT: production
  UPLOAD_DIR: /data/uploads
  EMBEDDING_PROVIDER: openai
  ANSWER_PROVIDER: openai
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  PUBLIC_DEMO_KEY: ${PUBLIC_DEMO_KEY:-}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: docsearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: docsearch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsearch -d docsearch"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    image: docsearch-app
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: docsearch-app
    restart: unless-stopped
    environment: *app-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    image: docsearch-app
    restart: unless-stopped
    command: ["rq", "worker", "ingestion", "--with-scheduler", "--url", "redis://redis:6379/0"]
    healthcheck:
      disable: true
    environment: *app-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  uploads:
  caddy_data:
  caddy_config:
