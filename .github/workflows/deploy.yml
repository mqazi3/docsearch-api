name: Deploy

# Runs after CI passes on main. Can also be started by hand from the Actions tab.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # lets the job request an OIDC token for AWS
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Run the deploy script on the server
        env:
          INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name docsearch-deploy \
            --comment "deploy ${GITHUB_SHA::7}" \
            --query Command.CommandId --output text)
          echo "SSM command $command_id"

          status=Pending
          for _ in $(seq 1 90); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $status"
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          output() {
            aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query "$1" --output text | tail -n 40
          }
          echo "--- server output ---"
          output StandardOutputContent
          if [ "$status" != "Success" ]; then
            echo "--- server errors ---"
            output StandardErrorContent
            exit 1
          fi

      - name: Check the live site
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS https://docsearch.mqazi98.com/health/ready; then exit 0; fi
            sleep 5
          done
          echo "Readiness check failed after deploy"
          exit 1